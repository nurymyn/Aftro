services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: apartment_preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U preview -d apartment_preview"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://preview:local-dev-only@database:5432/apartment_preview
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  catalog-data:
