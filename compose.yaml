services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: apartment_preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U preview -d apartment_preview"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrations:
    image: postgres:17
    environment:
      PGHOST: database
      PGDATABASE: apartment_preview
      PGUSER: preview
      PGPASSWORD: local-dev-only
    volumes:
      - ./database/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_accounts.sql"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://preview:local-dev-only@database:5432/apartment_preview
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      AFTRO_SECURE_COOKIES: ${AFTRO_SECURE_COOKIES:-0}
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  catalog-data:
